name: Bot quality checks

on:
  push:
    paths:
      - "vk-chaos-bot/**"
      - ".github/workflows/vk-chaos-bot.yml"
  pull_request:
    paths:
      - "vk-chaos-bot/**"
      - ".github/workflows/vk-chaos-bot.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vk-chaos-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vk-chaos-bot/package-lock.json
      - run: npm install
      - run: npm run check
      - run: npm test
